<div class="drop" id="drop" tabindex="0" role="button" aria-label="엑셀 파일 올리기">
  <big>엑셀 파일을 여기로 끌어다 놓으세요</big>
  <small>또는 이 칸을 눌러 파일 고르기 (.xlsx · .csv) · 파일은 내 컴퓨터 밖으로 나가지 않아요</small>
  <input type="file" id="file" accept=".xlsx,.csv,.tsv,.txt" hidden>
</div>
<p id="msg" class="hint"></p>
<label class="fld" hidden style="max-width:320px"><span>시트가 여러 개예요. 어느 것을 쓸까요?</span><select id="sheet"></select></label>
<div class="or">파일이 안 열리면</div>
<label class="fld"><span>엑셀에서 표를 드래그해 복사(Ctrl+C) → 여기에 붙여넣기 (제목 줄까지)</span><textarea id="paste" placeholder="여기에 붙여넣기"></textarea></label>
<div class="or">연습용 자료로 해 보기</div>
<div class="samples" id="samples"><button class="btn2" data-s="sales">매출 (수출입)</button><button class="btn2" data-s="purchase">구매</button><button class="btn2" data-s="defect">생산·불량</button></div>
